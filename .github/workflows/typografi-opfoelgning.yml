name: Typografi-opfølgning

# Engangskørsel 6/11-2026, anden og sidste del:
#   1) fjerner Inter-preloadet, som stadig hentede en skrift ingen bruger
#   2) skriver resultatet ind i design.md (§13) og retter statuslinjen
# Der committes kun hvis header-filen rammer præcis den sha256 der er gennemgået lokalt.
# Arbejdsgangen sletter sig selv i samme commit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/typografi-opfoelgning.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opfoelgning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fjern Inter-preload og opdater design.md
        run: |
          python3 - <<'PY'
          import hashlib
          import re

          p = 'css/header-dark-clockwork-active.html'
          lines = open(p, encoding='utf-8').read().split('\n')
          if len(lines) != 1357:
              raise SystemExit('header-filen er aendret (linjetal %d) - stop' % len(lines))
          if 'Inter preload' not in lines[1]:
              raise SystemExit('kommentaren i linje 2 er aendret: %r' % lines[1])
          if 'inter-variable.woff2' not in lines[2]:
              raise SystemExit('preload-linjen er aendret: %r' % lines[2][:120])

          lines[1] = '<!-- Juno font-perf (25/10): swap-overrides -->'
          del lines[2]
          b = '\n'.join(lines).encode('utf-8')
          sha = hashlib.sha256(b).hexdigest()
          forventet = 'd4b741ede867d39555ee8d4dffb0d4cd796494b521b96ccf834f1f4b61dbaf31'
          if sha != forventet:
              raise SystemExit('header matcher ikke den gennemgaaede version: %s' % sha)
          open(p, 'wb').write(b)
          print('header: %d bytes, sha256 %s' % (len(b), sha))

          d = open('design.md', encoding='utf-8').read()
          if '## 13. Udf' in d:
              raise SystemExit('design.md er allerede opdateret')
          m = re.search(r'^\*\*Status:\*\*.*$', d, re.M)
          if not m:
              raise SystemExit('statuslinjen blev ikke fundet')
          d = d[:m.end()] + ' Skrifterne i header-delen er skiftet 6/11 — se §13.' + d[m.end():]

          nyt = """

          ---

          ## 13. Udført 6/11-2026 — typografien

          Skiftet i §2 er gennemført i `css/header-dark-clockwork-active.html`.

          | | Før | Efter |
          | --- | --- | --- |
          | `@font-face`-erklæringer | 33 | 5 |
          | Overskrifter, ordmærke, produkttitler | Georgia 700 | Marcellus 400 |
          | Brødtekst (blev tvunget med `!important`) | Georgia | IBM Plex Sans |
          | Knapper | Georgia 800 | IBM Plex Sans 700 |
          | Preload af Inter i `<head>` | 1 fil ved hver sidevisning | fjernet |
          | Filstørrelse | 50 819 bytes | 44 403 bytes |

          Beholdt: Marcellus (400) og IBM Plex Sans (400, 500, 600, 700). Fjernet: Archivo, Arsenal,
          Baloo Tamma 2, Geom, Gotu, Heebo, Hind (×2), Inconsolata, Inter, Jost, Karla, Koulen, Manrope,
          Montserrat, Mulish, Noto Serif Display, Oswald, Radio Canada, Roboto Flex, Rubik,
          Source Serif Pro, Space Mono (×2) samt Plex 100/200/300.

          Georgia står tilbage som reserve i serif-stakken. Den findes på alle enheder, bliver ikke
          hentet, og sikrer at overskrifterne ikke falder til en systemfont, hvis Marcellus svigter.

          Overskrifterne er sat til vægt 400, fordi Marcellus kun findes i 400. En kunstig 700 ville
          sløre stavelserne — og på et display-ansigt er det tydeligt.

          **Verificeret:** filen er byte-identisk med den lokalt gennemgåede version (sha256-kontrol i
          arbejdsgangen), klammer 333/333 → 305/305, `@font-face` 33 → 5.
          **Ikke verificeret:** hvordan det ser ud på den live side. Header-delen skal stadig ind i
          WordPress, før en besøgende ser forskellen.
          """

          d = d.rstrip('\n') + '\n' + nyt.rstrip('\n') + '\n'
          open('design.md', 'w', encoding='utf-8').write(d)
          print('design.md: %d bytes' % len(d.encode('utf-8')))
          PY

      - name: Commit og push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -f .github/workflows/typografi-opfoelgning.yml
          git add css/header-dark-clockwork-active.html design.md
          git commit -q -F - <<'MSG'
          style: fjern Inter-preloadet og skriv typografien ind i design.md

          Preloadet hentede inter-variable.woff2 på hver sidevisning, selv om ingen
          @font-face erklærer Inter længere — den slags er præcis den døde vægt, oprydningen
          skulle fjerne. design.md får et §13 med tallene, så dokumentet beskriver hvad der
          faktisk er gjort, ikke hvad der burde gøres.

          Modul: Design/typografi — fase 1 af 5 (design.md §11)
          Før: 0 %  →  Efter: 20 %  (Δ +20)
          Grundlag: 1 af 5 faser i design.md §11; fasen selv 5 af 5 deltrin (33 → 5 @font-face, Georgia → Marcellus, brødtekst → IBM Plex Sans, Inter-preload fjernet, verificeret på sha256)

          🤖 Generated with Codebuff
          Co-Authored-By: Codebuff <noreply@codebuff.com>
          MSG
          git pull --rebase --autostash origin main
          git push origin HEAD:main
