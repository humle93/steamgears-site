name: Steamgears Autonomous SEO Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'knowledge_base/**'
      - 'seo_sources.txt'

permissions:
  contents: write

concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tjek at secrets er sat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          missing=""
          if [ -z "$GEMINI_API_KEY" ]; then missing="$missing GEMINI_API_KEY"; fi
          if [ -z "$WP_USER" ]; then missing="$missing WP_USER"; fi
          if [ -z "$WP_APP_PASS" ]; then missing="$missing WP_APP_PASS"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Manglende secrets::Tilføj under Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi
          echo "Alle tre secrets er sat."

      - name: Høst ny SEO-viden fra seo_sources.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python seo_harvester.py --list seo_sources.txt

      - name: Mål butikkens tilstand (agent-brief)
        # P8: den ugentlige plan skal bygge på kataloget som det er nu — ikke på 2/11-tallene.
        # Ingen secrets: kun offentlige endpoints (Store API og WP REST).
        run: python3 tools/agent_brief.py

      - name: Kør SEO Audit & Generer Optimeringsplan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python seo_agent.py

      - name: Gem og Commit Vidensbase og SEO-Plan til Repo
        run: |
          git config user.name "Steamgears SEO Bot"
          git config user.email "bot@steamgears.eu"
          mkdir -p reports
          git add -A knowledge_base reports docs/agent-brief.md
          if git diff --staged --quiet; then
            echo "Ingen ændringer — intet at committe."
            exit 0
          fi
          git commit -m "chore(seo): opdateret SEO-vidensbase og optimeringsplan"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push afvist (forsøg $attempt) — henter og prøver igen."
            git pull --rebase --autostash
          done
          echo "::error title=Push fejlede::Kunne ikke pushe SEO-planen efter 3 forsøg."
          exit 1
