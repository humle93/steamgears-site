name: Steamgears Autonomous SEO Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'knowledge_base/**'
      - 'seo_sources.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Høst ny SEO-viden fra seo_sources.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python seo_harvester.py --list seo_sources.txt

      - name: Kør SEO Audit & Generer Optimeringsplan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python seo_agent.py

      - name: Gem og Commit Vidensbase og SEO-Plan til Repo
        run: |
          git config user.name "Steamgears SEO Bot"
          git config user.email "bot@steamgears.eu"
          git add knowledge_base/ reports/
          git diff --staged --quiet || git commit -m "chore(seo): opdateret SEO-vidensbase og optimeringsplan"
          git push
