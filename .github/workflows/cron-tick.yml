name: cron-tick

# Webhotellet har DISABLE_WP_CRON slået til, wp-cron.php kører ikke de forfaldne opgaver,
# og W3TC cacher siderne foran PHP. Uden en ekstern ur stod Action Scheduler-køen stille
# (158 forfaldne handlinger målt 8/11) og den daglige helbredsmåling sidst skrevet 7/11.
#
# Dette job er den ur: det kalder det offentlige tick-endpoint, som kun kører opgaver der
# allerede er forfaldne, og højst én gang i minuttet (samme kontrakt som wp-cron.php).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prik WP-Cron gennem det offentlige tick
        run: |
          set -euo pipefail
          url="https://steamgears.eu/wp-json/sgap/v1/tick"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' --max-time 90 "$url" || echo 000)
            echo "Forsoeg $i: HTTP $code"
            cat /tmp/tick.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::Tick svarede ikke 200 efter tre forsoeg"
          exit 1
