name: Command Center CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/command-center-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/command-center-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: API-klient og tests (JVM, ingen Android SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test :core
        run: ./gradlew :core:test --console=plain
      - name: Upload test report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
