<!DOCTYPE html>
<html lang="da">
<head><meta charset="UTF-8"><title>Opret - Command Center v8.4</title>
<style>body{background:#141110;color:#f3e8d0;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#1c1814;border:1px solid #3a2e1e;padding:30px;width:320px;border-radius:4px}h2{color:#c99a4a;margin-top:0;text-align:center}.form-control{width:100%;padding:10px;margin:10px 0;background:#221d18;border:1px solid #3a2e1e;color:#f3e8d0;box-sizing:border-box}.btn{background:linear-gradient(160deg,#e7c77e,#c99a4a);color:#140f08;width:100%;padding:10px;border:none;font-weight:bold;cursor:pointer;margin-top:10px}</style>
</head>
<body><div class="card"><h2>⚡ Opret Bruger</h2>
<form action="/register" method="POST">
<input type="text" name="username" placeholder="Brugernavn" class="form-control" required>
<input type="password" name="password" placeholder="Adgangskode" class="form-control" required>
<button type="submit" class="btn">Opret</button>
</form></div></body></html>
