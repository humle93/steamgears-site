<style>
/* =========================================================
   STEAMGEARS — DARK CLOCKWORK THEATRE v3 (Henning Amundsen, 2026-10-18)
   Deployed site-wide by Juno · replaces Steampunk Skin v2
   ========================================================= */

/* =========================================================
   1. FARVER OG GRUNDINDSTILLINGER
   ========================================================= */

:root {
  --sg-black: #0e0b0c;
  --sg-black-soft: #151012;
  --sg-charcoal: #1e1719;
  --sg-panel: #2f1d21;

  --sg-gold-dark: #806126;

  --sg-ivory: #eee3cd;
  --sg-muted: #b9aa93;
  --sg-border: rgba(198, 160, 77, 0.7);

  --sg-shadow: rgba(0, 0, 0, 0.55);
}

/* =========================================================
   2. BODY OG GENEREL TYPOGRAFI
   ========================================================= */

html {
  scroll-behavior: smooth;
}

body {
  background:
    radial-gradient(
      ellipse at top,
      rgba(143, 48, 52, 0.18),
      transparent 48%
    ),

      135deg,
      #0e0b0c 0%,
      #171012 50%,
      #0b0809 100%
    ) !important;
  background-attachment: fixed;
  color: var(--sg-ivory) !important;
  font-family: Georgia, "Times New Roman", serif !important;
  line-height: 1.7;
}

p,
li {
  color: var(--sg-ivory);
  line-height: 1.8;
}

strong,
b {
  color: var(--sg-gold-light);
}

small {
  color: var(--sg-muted);
}

::selection {
  background: var(--sg-gold);
  color: var(--sg-black);
}

/* =========================================================
   3. LINKS
   ========================================================= */

a {
  color: var(--sg-gold-light);
  text-decoration-color: rgba(240, 210, 124, 0.45);
  transition:
    color 0.2s ease,
    text-decoration-color 0.2s ease;
}

a:hover,
a:focus {
  color: #fff3bc;
  text-decoration-color: var(--sg-gold-light);
}

/* =========================================================
   4. HEADER OG NAVIGATION
   ========================================================= */

.site-header,
header,
.wp-block-template-part,
.is-style-ext-preset--group--natural-1--header-1 {
  background:
    linear-gradient(
      180deg,
      rgba(38, 24, 27, 0.98),

  box-shadow: 0 8px 25px var(--sg-shadow);
  position: relative;
  z-index: 10;
}

.site-header::after,
header::after,
.is-style-ext-preset--group--natural-1--header-1::after {
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--sg-gold),

  content: "";

}

.site-title,

.site-title a,

}

  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.main-navigation a:hover,
.wp-block-navigation a:hover,
nav a:hover {
  color: var(--sg-gold-light) !important;
}

/* =========================================================
   5. OVERSKRIFTER
   ========================================================= */

h1,
h2,
h3,
h4,
h5,
h6 {

}

h1,
h2 {

}

h1 {
  font-size: clamp(2.2rem, 5vw, 4.6rem);
}

h2 {
  font-size: clamp(1.8rem, 3vw, 3rem);
}

h3 {

}

h1::after,
h2::after {

}

   ========================================================= */

.hero,

.wp-block-cover-image,

}

.wp-block-cover::after,

}

.wp-block-cover-image > *,
.hero > *,
.front-page-hero > * {

}

.wp-block-group,
.wp-block-column,
.wp-block-media-text,
.card,
.panel,
.content-card {

  border-left: 2px solid var(--sg-gold);

}

.steampunk-panel::after,

}

.woocommerce button.button,
.woocommerce input.button,

button:hover,

.woocommerce input.button:hover,

}

}

.wp-block-button.is-style-outline .wp-block-button__link:hover,
.button-outline:hover,
.btn-outline:hover {

}

.woocommerce div.product {

input,

/* =========================================================
   17. SG-MODULE-KOMPATIBILITET (layout + theatre-farver)
   ========================================================= */

/* Logo */
.sg-logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.sg-logo img{width:54px;height:54px;filter:drop-shadow(0 2px 8px rgba(198,160,77,.4))}
.sg-logo .sg-word{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1;color:#eee3cd;letter-spacing:.08em}
.sg-logo .sg-word b{color:#c6a04d;font-weight:700}

/* Hero */
.sg-hero{position:relative;min-height:76vh;display:flex;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(180deg,rgba(14,11,12,.5) 0%,rgba(14,11,12,.74) 55%,#0e0b0c 100%),
  url('https://steamgears.juno.page/steamgears-cdn/hero.webp') center/cover no-repeat;
  border-bottom:2px solid var(--sg-gold)}
.sg-hero-inner{max-width:900px;padding:110px 24px 90px;margin:0 auto}
.sg-hero .sg-eyebrow{color:var(--sg-gold);letter-spacing:.35em;text-transform:uppercase;font-size:13px;font-weight:700;margin-top:18px}
.sg-hero .sg-logomark{width:118px;height:118px;border:0 !important;background:none !important;box-shadow:none !important;padding:0 !important;filter:drop-shadow(0 6px 18px rgba(198,160,77,.5))}
.sg-hero h1{font-size:clamp(38px,6vw,66px);margin:18px 0 12px;color:var(--sg-gold-light) !important;border-bottom:0;padding-bottom:0;text-transform:none}
.sg-hero h1::after{display:none}
.sg-hero .sg-sub{font-size:19px;color:var(--sg-ivory);max-width:660px;margin:0 auto 30px}
.sg-btnrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.sg-btn{display:inline-block;background:linear-gradient(180deg,var(--sg-gold),var(--sg-gold-dark)) !important;
  color:#18100b !important;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  border:1px solid var(--sg-gold-light) !important;border-radius:0 !important;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 0 #422b16,0 8px 18px rgba(0,0,0,.35);
  padding:.85em 1.35em;text-decoration:none !important;font-family:Georgia,serif}
.sg-btn:hover{background:linear-gradient(180deg,var(--sg-gold-light),#a98031) !important;color:#110b09 !important;transform:translateY(-2px)}
.sg-ghost{display:inline-flex;align-items:center;gap:8px;color:var(--sg-gold-light);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:14px;border:1px solid rgba(240,210,124,.45);padding:14px 24px;border-radius:0;
  background:rgba(14,11,12,.45);text-decoration:none}
.sg-ghost:hover{background:var(--sg-gold);color:var(--sg-black)}
@media (max-width:782px){.sg-btnrow .sg-btn,.sg-btnrow .sg-ghost{width:auto !important}}

/* Tandhjuls-detalje (theatre-guld) */
