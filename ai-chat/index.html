<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f9;
      color: #1d1f2b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e2e4ef;
      font-weight: 600;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 720px;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b5bdb;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e4ef;
    }
    .msg.error {
      align-self: flex-start;
      background: #fff0f0;
      color: #a61e1e;
      border: 1px solid #f5c2c2;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e2e4ef;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #c9ccdd;
      border-radius: 8px;
      height: 44px;
    }
    button {
      padding: 0 18px;
      font: inherit;
      border: none;
      border-radius: 8px;
      background: #3b5bdb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.stop { background: #868e96; }
    footer {
      padding: 8px 20px;
      font-size: 13px;
      text-align: center;
      color: #5c6078;
      background: #fff;
      border-top: 1px solid #e2e4ef;
    }
    footer a { color: #3b5bdb; }
  </style>
</head>
<body>
  <header>AI Chat</header>

  <div id="messages"></div>

  <form id="chat-form">
    <textarea id="input" placeholder="Ask anything… (Enter to send, Shift+Enter for a new line)" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>

  <footer>
    Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener">Puter</a>
  </footer>

  <script src="https://js.puter.com/v2/"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Conversation history sent to the model on every turn.
    const history = [
      { role: 'system', content: 'You are a helpful, concise assistant.' }
    ];

    let controller = null;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.textContent = busy ? 'Stop' : 'Send';
      sendBtn.classList.toggle('stop', busy);
      sendBtn.type = busy ? 'button' : 'submit';
    }

    async function sendMessage(text) {
      history.push({ role: 'user', content: text });
      addMessage('user', text);

      const bubble = addMessage('assistant', '');
      let reply = '';
      controller = new AbortController();
      setBusy(true);

      try {
        const response = await puter.ai.chat(history, {
          stream: true,
          signal: controller.signal
        });
        for await (const part of response) {
          if (part.type === 'text') {
            reply += part.text;
            bubble.textContent = reply;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (part.type === 'error') {
            throw new Error(part.error || 'The model returned an error.');
          }
        }
        if (reply) {
          history.push({ role: 'assistant', content: reply });
        } else {
          bubble.remove();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          if (reply) history.push({ role: 'assistant', content: reply });
          else bubble.remove();
        } else {
          bubble.remove();
          history.pop(); // drop the unanswered user turn
          addMessage('error', 'Error: ' + (err.message || err));
        }
      } finally {
        controller = null;
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text);
    });

    sendBtn.addEventListener('click', (e) => {
      if (controller) {
        e.preventDefault();
        controller.abort();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
